name: Release candidate validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: Optional neural runtime profile (weights are never included)
        type: choice
        options: [base, cpu, cuda]
        default: base
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-base.lock pyinstaller==6.22.0
      - if: github.event_name == 'workflow_dispatch' && inputs.runtime == 'cpu'
        run: python -m pip install -r requirements-release-cpu.lock
      - if: github.event_name == 'workflow_dispatch' && inputs.runtime == 'cuda'
        run: python -m pip install -r requirements-release-cuda.lock
      - if: github.event_name == 'workflow_dispatch' && inputs.runtime != 'base'
        run: python -m pip install --no-deps -r requirements-model-adapters.lock
      - run: npm ci --prefix frontend
      - run: npm run build
      - run: python -m pytest -q
      - run: npx --prefix frontend playwright install chromium
      - run: npm --prefix frontend run test:browser
      - run: python scripts/build_package.py
      - run: python scripts/package_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-candidate-${{ matrix.os }}-${{ inputs.runtime || 'base' }}
          path: |
            dist/FaceSwap-*.zip
            dist/FaceSwap-*.tar.gz
            dist/*.sha256
          retention-days: 14
