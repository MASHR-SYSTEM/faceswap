[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceswap-local"
version = "0.2.0-alpha.7"
description = "Local camera effects and optional neural face transformation"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
